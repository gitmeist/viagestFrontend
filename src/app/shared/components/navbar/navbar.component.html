<header class="navbar">
  <div class="navbar-left">
    <button type="button" class="hamburger-btn" (click)="onToggleSidebar()" aria-label="Abrir menú">
      <i class="bi bi-list"></i>
    </button>
    <h4>Bienvenido, {{ username || 'Invitado' }}</h4>
  </div>

  <div class="actions">
    <button type="button" class="icon user-initials" aria-label="Perfil de usuario" title="Perfil" (click)="irAjustes()">
      {{ obtenerIniciales(username) }}
    </button>

    <button type="button" (click)="logout()" class="logout-btn" aria-label="Cerrar sesión" title="Cerrar sesión">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</header>
