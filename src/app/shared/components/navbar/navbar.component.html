<header class="navbar">
  <h2>Bienvenido, {{ username || 'Invitado' }}</h2>

  <div class="actions">
    <button type="button" class="icon" aria-label="Perfil de usuario" title="Perfil">
      <i class="bi bi-person-circle"></i>
    </button>
    <button type="button" (click)="logout()" class="logout-btn" aria-label="Cerrar sesión" title="Cerrar sesión">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</header>
