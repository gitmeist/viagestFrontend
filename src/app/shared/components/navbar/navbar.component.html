<header class="navbar">
  <h2>Bienvenido, {{ username || 'Invitado' }}</h2>

  <div class="actions">
    <button type="button" class="icon" aria-label="Notificaciones" title="Notificaciones">
      <span aria-hidden="true">🔔</span>
    </button>
    <button type="button" class="icon" aria-label="Perfil de usuario" title="Perfil">
      <span aria-hidden="true">👤</span>
    </button>
    <button type="button" (click)="logout()" class="logout-btn">Cerrar sesión</button>
  </div>
</header>
