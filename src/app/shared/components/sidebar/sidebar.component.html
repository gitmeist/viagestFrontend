<nav class="sb" [class.sb-abierto]="abierto">
  <!-- Marca -->
  <div class="sb__brand">
    <img src="assets/img/logoBlanco.png" alt="Logo" class="logo-img">
    <span class="sb__name">ViaGest</span>
  </div>


  <ul class="sb__menu">
    <!-- Inicio -->
    <li *ngIf="userRole">
      <a routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="onLinkClick()">
        <span class="sb__ico" aria-hidden="true">
          <i class="bi bi-house"></i>
        </span>
        Home
      </a>
    </li>


    <!-- Clientes -->
    <li *ngIf="userRole && (userRole.includes('ADMON') || userRole.includes('AGENTE') || userRole.includes('EMPLEADO'))">
      <a routerLink="/clientes" routerLinkActive="is-active" (click)="onLinkClick()">
        <span class="sb__ico" aria-hidden="true">
          <i class="bi bi-people"></i>
        </span>
        Clientes
      </a>
    </li>


    <!-- Paquetes -->
    <li *ngIf="userRole && (userRole.includes('ADMON') || userRole.includes('AGENTE'))">
      <a routerLink="/paquetes" routerLinkActive="is-active" (click)="onLinkClick()">
        <span class="sb__ico" aria-hidden="true">
          <i class="bi bi-archive"></i>
        </span>
        Paquetes
      </a>
    </li>


    <!-- Reservas -->
    <li *ngIf="userRole && (userRole.includes('ADMON') || userRole.includes('AGENTE') || userRole.includes('EMPLEADO'))">
      <a routerLink="/reservas" routerLinkActive="is-active" (click)="onLinkClick()">
        <span class="sb__ico" aria-hidden="true">
          <i class="bi bi-calendar-check"></i>
        </span>
        Reservas
      </a>
    </li>


    <!-- Pagos -->
    <li *ngIf="userRole && (userRole.includes('ADMON') || userRole.includes('EMPLEADO'))">
      <a routerLink="/pagos" routerLinkActive="is-active" (click)="onLinkClick()">
        <span classs="sb__ico" aria-hidden="true">
          <i class="bi bi-credit-card"></i>
        </span>
        Pagos
      </a>
    </li>


    <!-- Ajustes -->
    <li *ngIf="userRole && (userRole.includes('ADMON') || userRole.includes('AGENTE') || userRole.includes('EMPLEADO'))" class="sb__bottom">
      <a routerLink="/settings" routerLinkActive="is-active" (click)="onLinkClick()">
        <span class="sb__ico" aria-hidden="true">
          <i class="bi bi-gear"></i>
        </span>
        <span>Ajustes</span>
      </a>
    </li>
  </ul>
</nav>
