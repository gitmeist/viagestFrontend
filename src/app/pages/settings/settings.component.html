<div class="settings-container mx-3">
  <div>
    <!-- Cabecera -->
    <div class="d-flex justify-content-between align-items-center mb-4 px-4 mt-3">
      <h2 class="fw-semibold text-dark mb-0">Ajustes de Usuario</h2>
    </div>

    <!-- Perfil de Usuario -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Perfil de Usuario</h5>

        <div class="row align-items-center mb-3">
          <div class="col-md-2 text-center">
            <img src="assets/avatar-placeholder.png" class="rounded-circle img-fluid mb-2" width="80" alt="avatar">
            <button class="btn btn-outline-secondary w-100">Subir nueva foto</button>
          </div>

          <div class="col-md-10">
            <form [formGroup]="usuarioForm">
              <div class="row g-3">
                <!-- Nombre completo -->
                <div class="col-md-6">
                  <label class="form-label">Nombre completo</label>
                  <input type="text" class="form-control" formControlName="nombre" placeholder="Ingrese su nombre completo">
                </div>

                <!-- Email -->
                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" formControlName="email" placeholder="email@example.com">
                </div>

                <!-- Rol -->
                <div class="col-md-6">
                  <label class="form-label">Rol</label>
                  <span class="badge bg-primary d-block py-2 fs-6">
                    {{ usuarioForm.get('rol')?.value }}
                  </span>
                </div>

                <!-- Estado de la cuenta -->
                <div class="col-md-6">
                  <label class="form-label">Estado de la cuenta</label>
                  <div class="form-check form-switch">
                    <input class="form-check-input"
                           type="checkbox"
                           id="estadoCuenta"
                           formControlName="enabled">
                    <label class="form-check-label" for="estadoCuenta">
                      {{ usuarioForm.get('enabled')?.value ? 'Activo' : 'Inactivo' }}
                    </label>
                  </div>
                </div>
              </div>

              <!-- Botones -->
              <div class="text-end mt-4">
                <button class="btn-cancelar me-2" type="button">Cancelar</button>
                <button class="btn btn-turquoise shadow-sm" type="button" (click)="guardarCambios()">Guardar Cambios</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Gestión de Usuarios -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="card-title mb-0">Gestión de Usuarios</h5>
          <button class="btn btn-turquoise btn-sm">
            <i class="bi bi-plus-lg me-1"></i> Nuevo Usuario
          </button>
        </div>

        <div class="table-responsive flex-grow-1">
          <table class="table align-middle table-hover">
            <thead class="table-light">
              <tr>
                <th>Nombre de usuario</th>
                <th>Nombre completo</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Email</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let u of usuarios">
                <td>{{ u.username }}</td>
                <td>{{ u.nombre }}</td>
                <td>
                  <span class="badge"
                        [ngClass]="{
                          'bg-success': u.rol === 'AGENTE',
                          'bg-warning text-dark': u.rol === 'ADMIN',
                          'bg-secondary': u.rol === 'EMPLEADO'
                        }">
                    {{ u.rol }}
                  </span>
                </td>
                <td>
                  <span class="d-flex align-items-center">
                    <span class="status-dot me-2"
                          [ngClass]="{
                            'bg-success': u.enabled === 1,
                            'bg-danger': u.enabled === 0
                          }">
                    </span>
                    {{ u.enabled === 1 ? 'Activo' : 'Inactivo' }}
                  </span>
                </td>
                <td>{{ u.email }}</td>
                <td class="text-center">
                  <button class="btn btn-icon btn-outline-success me-1"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-icon btn-outline-danger" (click)="eliminarUsuario(u.username)"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>
</div>
