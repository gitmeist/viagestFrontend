<!-- Tarjetas de resumen -->
<div class="cards">
  <div class="card" *ngFor="let item of resumen">
    <div class="icon">{{ item.icon }}</div>
    <p>{{ item.label }}</p>
    <h2>{{ item.value }}</h2> <!-- Ingresos ahora mostrarán el total del último mes -->
  </div>
</div>

<!-- Sección de reservas activas -->
<div class="section">
  <h3>Últimas reservas</h3>

  <table>
    <thead>
      <tr>
        <th>Cliente</th>
        <th>Paquete</th>
        <th>Fecha de viaje</th>
        <th>Estado</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of reservasActivas">
        <td>{{ r.cliente?.nombre }}</td>
        <td>{{ r.paquete?.nombre }}</td>
        <td>{{ r.fechaViaje | date: 'dd/MM/yyyy' }}</td>
        <td>
          <span class="estado {{ r.estadoReserva | lowercase }}">
            {{ r.estadoReserva }}
          </span>
        </td>
      </tr>

      <tr *ngIf="reservasActivas.length === 0">
        <td colspan="4" class="sin-datos">No hay reservas activas</td>
      </tr>
    </tbody>
  </table>
</div>
